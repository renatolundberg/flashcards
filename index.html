<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>Flashcards</h1>
    <span id="count" class="muted"></span>
    <span id="drive-status" class="muted hint"></span>
    <button id="play-all" class="study-only">Tocar tudo</button>
    <div id="mode" role="group" aria-label="Modo">
      <button id="mode-edit">Editar</button>
      <button id="mode-view">Visualizar</button>
      <button id="mode-study">Estudar</button>
    </div>
    <button id="drive" class="edit-only">Selecionar pasta</button>
    <button id="new-card" class="edit-only">Novo card</button>
  </header>

  <main>
    <nav id="tags" aria-label="Hashtags"></nav>
    <section id="cards"></section>
    <aside id="pinned" aria-label="Pinned cards"></aside>
  </main>

  <div id="player" hidden>
    <div class="player-bar">
      <span id="player-info" class="muted"></span>
      <button id="player-close" aria-label="Fechar player">✕</button>
    </div>
    <div id="player-frame"></div>
  </div>
</body>
</html>
